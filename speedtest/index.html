  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    body.wm { overflow-x: hidden; }

    .speedtest-page { display: block; }

    /* .wm-head p would otherwise restyle the eyebrow as a lede */
    .wm-head .wm-eyebrow { margin: 0 0 1em; max-width: none; font-size: .82rem; line-height: 1.4; color: var(--wm-faint); }

    /* Card holding the widget */
    .speedtest-card {
      padding: clamp(6px, 1.2vw, 12px);
      overflow: hidden;
      box-shadow: var(--wm-shadow);
    }

    .speedtest-embed {
      position: relative;
      width: 100%;
      height: 0;
      min-height: 420px;
      padding-bottom: 56.25%;
      overflow: hidden;
      border-radius: 14px;
      background: var(--wm-bg-2);
    }

    .speedtest-embed iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      min-height: 420px;
      border: 0;
    }

    .speedtest-attribution {
      margin: 18px 0 0;
      text-align: center;
      font-size: .875rem;
      color: var(--wm-faint);
    }

    .speedtest-attribution a {
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      color: var(--wm-accent);
      font-weight: 600;
      text-decoration: underline;
      text-decoration-color: color-mix(in srgb, var(--wm-accent) 40%, transparent);
      text-underline-offset: 3px;
    }

    .speedtest-attribution a:hover { text-decoration-color: currentColor; }
  </style>
