<!--
  Haven's web client is not served from this address. This site is one origin shared by every
  page and tool on it, and a browser keeps a site's stored data per origin: anything else served
  here could reach what the client stores. So the client lives on Haven's own address, which
  serves nothing else, and this page only sends you there. (It replaces a 2026-06 prototype that
  kept an account seed in this origin's localStorage; that is cleared below.)
-->
