name: Mirror app docs into /apps

# Pulls the `docs/` landing pages from each app's own public repo and
# mirrors them under `apps/<slug>/` in this repo. Keeps the source of truth
# in each app repo while consolidating hosting onto wemiller.com/apps/<slug>/.
#
# Triggers:
#   - `schedule`   — belt-and-braces hourly mirror in case a notify fires
#                    while this workflow is cooldown'd.
#   - `workflow_dispatch` — manual trigger from the Actions tab.
#   - `repository_dispatch` with `event_type: mirror-app-docs` — fired by
#     each app repo's tiny notify workflow on push to main (optional; if
#     you don't wire that up, cron is enough).
#
# Why pull instead of push: the app repos are public, so this workflow
# checks them out with zero extra credentials. Push-mirroring would need
# a write-scoped PAT stored in every app repo (secret sprawl). The write
# token needed for commit-back is the default `GITHUB_TOKEN` plus
# `contents: write` permission, scoped to this repo only.

on:
  # Daily fallback so a repo-dispatch failure / missed notify still lands
  # fresh docs within 24h. The real-time trigger is `repository_dispatch`
  # fired by each app repo's tiny notify workflow on push to its main.
  schedule:
    - cron: '17 7 * * *'   # 07:17 UTC daily (~03:17 ET)
  workflow_dispatch:
  repository_dispatch:
    types: [mirror-app-docs]

permissions:
  contents: write
  actions: write   # start deploy-pages after a mirror commit (see the last step)

concurrency:
  group: mirror-app-docs
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout portfolio
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      # Each entry is "<app-repo>:<portfolio-slug>". The source path
      # inside the app repo is always `docs/`. Add more lines here to
      # onboard a new app — no other workflow changes needed.
      - name: Mirror Blip docs
        uses: actions/checkout@v4
        with:
          repository: blaineam/Blip
          path: .mirror/blip
          ref: main
          persist-credentials: false

      - name: Mirror Glint docs
        uses: actions/checkout@v4
        with:
          repository: blaineam/Glint
          path: .mirror/glint
          ref: main
          persist-credentials: false

      - name: Mirror Lathe docs
        uses: actions/checkout@v4
        with:
          repository: blaineam/Lathe
          path: .mirror/lathe
          ref: main
          persist-credentials: false

      # Haven's landing site lives in web/ (not docs/), and the site links to the
      # relay install scripts — both mirrored in the Haven block under "Sync into apps/".
      - name: Mirror Haven site
        uses: actions/checkout@v4
        with:
          repository: blaineam/haven
          path: .mirror/haven
          ref: main
          persist-credentials: false

      # Tom's web app (web/ + the engine in lib/) is served at /tools/tom/app/; the
      # marketing page at /tools/tom/ is authored here. tom.wemiller.com now only
      # redirects to these paths.
      - name: Mirror Tom web app
        uses: actions/checkout@v4
        with:
          repository: blaineam/Tom
          path: .mirror/tom
          ref: main
          persist-credentials: false

      # Monkr's app shell is built here (SvelteKit, base /tools/monkr/app) and served at
      # /tools/monkr/app/. Its device frames and backgrounds (~145 MB) stay on
      # monkr.wemiller.com and load cross-origin, so they're left out of the checkout too.
      - name: Check out Monkr (without its media)
        uses: actions/checkout@v4
        with:
          repository: blaineam/Monkr
          path: .mirror/monkr
          ref: main
          persist-credentials: false
          # Full commit history (blobs are still fetched lazily): the build names itself after
          # the last commit that touched the app, so an unchanged app rebuilds byte-identical.
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/static/devices/
            !/static/backgrounds/

      - name: Set up Node for the Monkr build
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: .mirror/monkr/package-lock.json

      - name: Build the Monkr app shell
        working-directory: .mirror/monkr
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: |
          npm ci --no-audit --no-fund
          ./scripts/build-portfolio.sh

      # rsync with --delete keeps the mirror exactly in sync: if the app
      # repo renames/drops a file in docs/, the portfolio loses it too.
      # Filter rules:
      #   * exclude CNAME — the app's subdomain CNAME would hijack
      #     wemiller.com if copied up.
      #   * exclude appstore-screenshots/ and *.monkr — App Store source captures (~350 MB) that
      #     no page references; mirroring them tripled every Pages artifact.
      #   * protect `assets/images/` — the apps grid (apps/index.html) uses
      #     `apps/<slug>/assets/images/icon.png` as the card icon and that
      #     file isn't tracked inside each app's docs/. `protect` (P)
      #     prevents --delete from removing destination paths that don't
      #     exist in the source.
      - name: Sync into apps/
        run: |
          set -euo pipefail
          sync_one() {
            local slug="$1" src="$2"
            mkdir -p "apps/$slug"
            rsync -av --delete \
              --filter='P assets/images/' \
              --exclude='CNAME' \
              --exclude='.git' \
              --exclude='.github' \
              --exclude='appstore-screenshots/' --exclude='*.monkr' \
              "$src/docs/" "apps/$slug/"
          }
          sync_one blip  .mirror/blip
          sync_one glint .mirror/glint

          # Lathe's docs/ is generated by its build.py from docs/_src; only
          # the built site is mirrored, not the generator or its inputs.
          mkdir -p apps/lathe
          rsync -av --delete \
            --filter='P assets/images/' \
            --exclude='CNAME' --exclude='.git' --exclude='.github' \
            --exclude='_src/' --exclude='_shared.py' --exclude='build.py' \
            --exclude='__pycache__/' --exclude='*.md' \
            .mirror/lathe/docs/ apps/lathe/

          # Haven: source is web/ (not docs/), plus the relay install scripts the site
          # links to. Protect the portfolio-only extras (card icon, app/, bridge/, relay/).
          mkdir -p apps/haven apps/haven/relay
          rsync -av --delete \
            --filter='P app/' --filter='P bridge/' --filter='P relay/' \
            --filter='P assets/icon.png' \
            --exclude='CNAME' --exclude='.git' --exclude='.github' --exclude='_preview.html' \
            .mirror/haven/web/ apps/haven/
          cp .mirror/haven/relay/install.sh .mirror/haven/relay/install.ps1 apps/haven/relay/

          # Tom: the same layout its own Pages build used (web/ at the root, lib/ beside
          # it), every relative module URL stamped with the commit by Tom's own
          # scripts/stamp.mjs (its service worker relies on that format, so the
          # portfolio's cache-bust.py leaves tools/tom/app alone). ~0.4 MB, no audio
          # files: Tom renders every note on the device.
          mkdir -p tools/tom/app
          rsync -av --delete --filter='P lib/' \
            --exclude='CNAME' --exclude='.git' --exclude='.github' \
            .mirror/tom/web/ tools/tom/app/
          rsync -av --delete --exclude='*.test.mjs' .mirror/tom/lib/ tools/tom/app/lib/
          node .mirror/tom/scripts/stamp.mjs tools/tom/app "$(git -C .mirror/tom rev-parse --short=8 HEAD)"
          # Monkr: the built shell only (~0.6 MB; scripts/build-portfolio.sh drops the media).
          # SvelteKit names its bundles by content hash, so cache-bust.py leaves it alone too.
          mkdir -p tools/monkr/app
          rsync -av --delete --exclude='devices/' --exclude='backgrounds/' --exclude='CNAME' \
            .mirror/monkr/build-portfolio/ tools/monkr/app/
          # Remember that the visitor entered the app (so /tools/tom/ sends them straight
          # in next time) and link back to the marketing page from the app's footer.
          python3 scripts/inject-tool-shell.py

      # Canonicalize the landing pages: the app repos still reference
      # their old <slug>.wemiller.com subdomains in canonical / og / schema
      # tags. We flip them to the new /apps/<slug>/ path at mirror time
      # so the app repos don't need any edits.
      - name: Rewrite subdomain URLs → /apps/<slug>/
        run: |
          set -euo pipefail
          for slug in blip glint; do
            f="apps/$slug/index.html"
            [ -f "$f" ] || continue
            sed -i "s|https://$slug.wemiller.com/|https://wemiller.com/apps/$slug/|g" "$f"
          done

      # The mirrored sites have no portfolio navigation of their own — they
      # are each app's site, hosted here. This adds one small pill (icon,
      # name, link back to /apps/) so someone landing from a search result
      # can see whose app it is and find the others. Injected at mirror time
      # rather than committed upstream: the app repos stay unaware of where
      # their docs are hosted.
      - name: Inject the back-to-apps pill
        run: python3 scripts/inject-back-to-apps.py

      # `?v=<content hash>` on every image/script/stylesheet URL — including the pill just injected.
      # The sources are stamped in their own repos; this catches anything they missed (Lathe's
      # docs/ is generated) so a year-cached stale i18n.js can never outlive a change again.
      - name: Stamp cache busters on the mirrored sites
        run: python3 scripts/cache-bust.py --mirrored apps/blip apps/glint apps/haven apps/lathe

      # Campaign parameters on the mirrored sites' store links (and Haven's i18n dictionaries,
      # whose strings carry the same links), so the commit below matches what deploy publishes.
      - name: Tag store links on the mirrored sites
        run: |
          python3 scripts/store-links.py --mirrored apps/blip apps/glint apps/haven apps/lathe tools/tom/app tools/monkr/app
          python3 scripts/store-links.py --mirrored --check apps/blip apps/glint apps/haven apps/lathe tools/tom/app tools/monkr/app

      - name: Commit mirrored docs
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/blip apps/glint apps/haven apps/lathe tools/tom/app tools/monkr/app
          if git diff --cached --quiet; then
            echo "No upstream doc changes — nothing to mirror."
          else
            git commit -m "chore(mirror): sync blip/glint/haven/lathe sites → /apps, tom + monkr → /tools [skip ci]"
            # deploy-pages commits regenerated posters to main too; a run that lands while this one
            # is building would otherwise reject the push. Only generated files on both sides.
            git pull --rebase origin main
            git push
            # A push made with GITHUB_TOKEN (and [skip ci]) starts no workflow, so the mirror
            # would only go live with the next human push. A dispatch is allowed to start one.
            gh workflow run deploy-pages.yml --ref main
          fi
        env:
          GH_TOKEN: ${{ github.token }}
