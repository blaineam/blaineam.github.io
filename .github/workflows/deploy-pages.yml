name: Build & Deploy GitHub Pages

on:
  push:
    branches: [main]
    # Skip when the ONLY changed paths are the generated poster
    # assets — that commit comes from the bot-authored "chore(posters):
    # regenerate via CI" step below, and re-running on it causes
    # an infinite loop (JPEG encoding isn't bit-stable, so each
    # regen produces fresh bytes even for the same inputs).
    # `paths-ignore` only skips when EVERY changed path matches; a
    # human commit that touches source files + incidentally
    # re-runs the generator still triggers the workflow.
    paths-ignore:
      - 'apps/**/poster.jpg'
      - 'apps/apps-by-blaine-miller.jpg'
      - 'apps/.poster-cache.json'
      - 'og/**'
      - 'contingency/**'
  workflow_dispatch:

permissions:
  contents: write       # needed to commit regenerated posters back to main
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Persist-credentials so the regeneration commit below can push back.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          # `fetch-depth: 0` isn't needed — we only need HEAD for the
          # commit-back step.

      - name: Set up Node.js
        # 24, not 20, because of the npm that ships with each. The sharp
        # bump in #34 regenerated scripts/package-lock.json with npm 11,
        # which records an absent optional dependency as a bare
        # `{"optional": true}` with no version field — seven of them, for
        # platform-specific libvips builds. npm 10, which node 20 ships,
        # hands that missing version straight to semver and dies with
        # `Invalid Version:`, so every deploy since #34 has failed before
        # reaching the build. sharp 0.35.5 itself wants node >=20.9.
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: scripts/package-lock.json

      - name: Install poster-generator dependencies
        working-directory: scripts
        run: npm ci

      # The home page, /resume/, /shell, the search index, photo thumbnails, the English home-page
      # dictionary, the profile bios and the README's project table all come from /content.
      # Running it here means a content edit made in the GitHub web editor (a new caption, a new
      # photo dropped into /slides) is enough; nothing has to be built locally first. With nothing
      # to change it writes nothing.
      - name: Build the home page from /content
        env:
          # The note the site shows in the contingency state. Empty in normal times.
          CONTINGENCY_NOTE: ${{ secrets.CONTINGENCY_NOTE }}
        run: node scripts/build-site.mjs

      # Regenerates apps/apps-by-blaine-miller.jpg, every app's
      # apps/<slug>/assets/images/poster.jpg, and .poster-cache.json.
      # `--force` is intentional: we always re-run the hue-sampling
      # so commits from any contributor get a fresh poster baked
      # rather than relying on the fingerprint heuristic. If nothing
      # changed the output is byte-identical and the commit-back step
      # below is a no-op.
      - name: Regenerate app posters
        run: node scripts/generate-posters.js --force

      # Open Graph posters for the portfolio's own pages (home, Work, resume, panoramas, puzzles,
      # VR, speed test, privacy, terms, 404) in /og. Each is redrawn only when its recipe or its
      # photograph changed (og/.hashes.json), using the Chrome that ships on the runner, so with
      # nothing changed this writes nothing.
      # The trail's posters come in nine languages. The runner has no Chinese, Japanese or Korean
      # fonts, so they are fetched first, but only when something is actually going to be redrawn.
      - name: Draw Open Graph posters for the site's own pages
        run: |
          node scripts/build-og.mjs --check || { sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk; }
          node scripts/build-og.mjs

      # The posters have just been rewritten, so any `?v=` stamp pointing at one is now stale —
      # and og:image is exactly where that matters, since a scraper caches the first fetch of a
      # shared link. This is the only place that can know the regenerated bytes, so the stamps are
      # refreshed here rather than by whoever last edited a page.
      # Scripts and stylesheets too (they share the CDN's year-long max-age), and the mirrored app
      # sites as well — their sources are stamped upstream, so this is normally a no-op for them.
      # The trail's modules load each other, and the CDN keeps scripts for a year, so their
      # imports carry one shared version stamp. This must run before the pages are re-stamped,
      # because it changes trail.js.
      - name: Stamp the trail's own imports
        run: node scripts/trail-stamp.mjs

      - name: Re-stamp image, script and stylesheet cache busters
        run: python3 scripts/cache-bust.py --mirrored

      # The trail has one page per language, so crawlers and link previews that do not run scripts
      # see translated words. They are copies of trail/index.html, so this runs after the re-stamp.
      - name: Write the trail's language pages
        run: node scripts/trail-pages.mjs

      # Store-native campaign parameters on every App Store / Google Play / Microsoft Store link
      # (`ct=wm-<page>` and the provider token from scripts/store-links.json; Play's `referrer`;
      # Microsoft's `cid`), so the store consoles report which page sent each visitor. The mirrored
      # app sites are tagged here too — their repos never carry the tags. Pasting the provider token
      # into store-links.json and pushing is all it takes to re-tag every page.
      - name: Tag store links with their page's campaign
        run: python3 scripts/store-links.py --mirrored

      # The rewrite must be a fixed point: a second pass that would change anything means the
      # tagger double-tags or disagrees with itself, and that should fail the deploy, not ship.
      - name: Check store-link tags
        run: python3 scripts/store-links.py --mirrored --check

      # Commit and push any regenerated poster files + cache update
      # back to `main`. This is the step the repo was missing —
      # previously posters only lived inside the Pages artifact, so:
      #   1. GitHub's legacy default `pages-build-deployment` workflow
      #      (the one that runs when Pages source = "Deploy from a
      #      branch") had nothing to deploy from the repo and thus
      #      clobbered the artifact.
      #   2. Direct-hotlinking to e.g.
      #      wemiller.com/apps/asteroic/assets/images/poster.jpg
      #      from a fresh checkout (or a meta og:image scraper that
      #      checks the repo directly) would 404.
      #
      # The Pages source is now `workflow` (not `legacy`), so the
      # default workflow is disabled and only THIS pipeline deploys.
      # Committing the posters back is still worth doing so the repo
      # is self-describing — you can clone it and see the generated
      # assets without needing to run the generator locally.
      - name: Commit regenerated posters
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/apps-by-blaine-miller.jpg \
                  apps/.poster-cache.json \
                  apps/*/assets/images/poster.jpg
          git add og
          # Everything scripts/build-site.mjs derives from /content.
          git add -A slides
          git add index.html hire resume shell search-index.json app-sheets.json profiles README.md sitemap.xml assets/site.min.js assets/site.min.css \
                  i18n/index.en.json slides/thumbs projects/lg projects/shots profiles/contributions.json
          # Pages whose `?v=` stamps the re-stamp step just refreshed.
          git add -u '*.html' '*.css' 2>/dev/null || true
          # Store links the tagging step just rewrote outside HTML.
          git add -u 'i18n/*.json' 'apps/*/i18n/*.json' apps/projects.json README.md 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No poster changes to commit."
          else
            git commit -m "chore(posters): regenerate, re-stamp and tag store links via CI [skip ci]"
            git push
          fi

      # The list of pages and small files that sw.js saves so the site opens offline, and the build
      # stamp that tells browsers a new deploy is out. Last, so it sees every page as it will be served.
      - name: Build the offline file list
        run: node scripts/build-offline.mjs

      # upload-pages-artifact tars the whole checkout minus .git/.github, so drop what the site
      # never serves (the poster generator's node_modules, ~17 MB).
      - name: Drop build-only files from the Pages payload
        run: rm -rf scripts/node_modules

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # retention-days: 1 caps billed Actions storage — the default is 90
       # days, which caused unexpired `github-pages` artifacts (~420 MB each)
       # to stack up at 3.7 GB+ after a day of frequent redeploys. Only the
       # latest artifact is ever served by Pages; older ones are dead weight.
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
